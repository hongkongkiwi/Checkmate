name = "checkmate"
main = "src/cf-worker.js"
compatibility_date = "2024-01-01"
node_compat = true

# Environment variables
[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "checkmate"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" # Replace with your D1 database ID

# R2 bucket for static assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "checkmate-assets"
preview_bucket_name = "checkmate-assets-preview"

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" # Replace with your KV namespace ID
preview_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" # Replace with your KV namespace ID

# Queues
[[queues.producers]]
binding = "QUEUE"
queue = "checkmate-queue"

[[queues.consumers]]
queue = "checkmate-queue"

# Triggers
[triggers]
crons = [
  "*/5 * * * *",    # Run every 5 minutes for monitor checks
  "0 */6 * * *",    # Run every 6 hours for token cleanup
  "0 2 * * *"       # Run daily at 2 AM for old checks cleanup
]

# Placement
[placement]
mode = "smart"